<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omar Ashraf</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="style.css">
</head>



<body>




  
<div class="crud">
  



  
<div class="head">
<h2>crud</h2>
<p>PRODUCT MANAGEMENT SYSTEM</p>


</div>
<div class="inputs">
<input placeholder="title" type="text" id="title">
<div class="price">
  <input onkeyup="gettotal()" placeholder="price" type="number" id="price">
  <input onkeyup="gettotal()" placeholder="taxes" type="number" id="taxes">
  
  <input onkeyup="gettotal()" placeholder="ads" type="number" id="ads">
  <input onkeyup="gettotal()" placeholder="discount" type="number" id="discount">
  <small id="total"></small>
</div>

<input type="number" placeholder="count" id="count">
<input type="text" id="category" placeholder="category">
<button id="submit">CREAT</button>
</div>
<div class="outputs">
<div class="searchblock">


  <input onkeyup="searchdata(this.value)" type="text" id="search" placeholder="search">
  <div class="btnsearch">

       <button onclick="getsearchmood(this.id)" id="searchtitle">search by title</button>
        <button  onclick="getsearchmood(this.id)" id="searchcategory">search by catogry</button>

  </div>
</div>
<div id="deleteall">




  
</div>
<div class="table-wrapper">
<table>


  <tr>
    <th>id</th>
    <th>title</th>
    <th>price</th>
    <th>taxes</th>
    <th>ads</th>
    <th>discount</th>
    <th>total</th>
    <th>category</th>
    <th>update</th>
    <th>delete</th>
  </tr>
  <tbody id='tbody'>


  </tbody>
</table>
</div>

</div>

</div>


<p id="result"></p>

<script src="work.js"></script>

</body>
</html>
